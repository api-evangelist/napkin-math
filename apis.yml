aid: napkin-math
name: Napkin Math
description: >-
  Napkin Math is a personalized AI food journal from Paper Star (a Y Combinator
  company, founded 2026 in San Francisco by Manuel Castro, Claire Nord, and
  Jynnie Tang). Marketed as "an AI nutrition coach in your pocket," it is a
  simple, beautiful food diary that helps people log meals and understand their
  eating habits over time. The product is a consumer mobile application rather
  than a developer platform: as of this profile Napkin Math publishes no public
  API, developer documentation, SDKs, OpenAPI, MCP server, or /.well-known
  discovery surface. This entry is maintained in the API Evangelist network as a
  company profile and enrichment lead; it will be upgraded to carry API
  artifacts if and when Napkin Math or Paper Star exposes a public API surface.
